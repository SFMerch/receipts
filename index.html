<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFM Receipts</title>
<meta name="theme-color" content="#1d4e89">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SFM Receipts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
  <span class="title">SFM Receipts</span>
  <span id="netStatus" class="net"></span>
</header>

<main>
  <!-- Login -->
  <section id="screenLogin" class="screen hidden">
    <h1>Sign in</h1>
    <label for="loginName">First name</label>
    <input id="loginName" autocomplete="given-name" autocapitalize="words" spellcheck="false">
    <label for="loginPin">6-digit PIN</label>
    <input id="loginPin" type="password" inputmode="numeric" pattern="\d*" maxlength="6" autocomplete="off">
    <button id="btnLogin" class="primary">Sign in</button>
    <p id="loginMsg" class="msg"></p>
  </section>

  <!-- Home -->
  <section id="screenHome" class="screen hidden">
    <p class="hello">Hi, <span id="helloName"></span></p>
    <p id="myCar" class="sub"></p>
    <button id="btnGas" class="big gas">Gas</button>
    <button id="btnPurchase" class="big purchase">Purchase</button>
    <div id="installTip" class="tip hidden"></div>
    <p class="foot">
      <span id="sessionInfo"></span><br>
      <a href="#" id="lnkLogout">Sign out</a>
    </p>
  </section>

  <!-- Placeholder for Gas / Purchase (built in the next step) -->
  <section id="screenSoon" class="screen hidden">
    <h1 id="soonTitle"></h1>
    <p class="sub">This screen is coming in the next update.</p>
    <button class="secondary" data-back>Back</button>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
